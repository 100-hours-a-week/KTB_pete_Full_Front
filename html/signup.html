<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>회원가입 | 아무 말 대잔치</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/signup.css" />
  </head>
  <body>
    <header class="header">
      <button
        id="back-btn"
        class="back-btn"
        type="button"
        aria-label="로그인으로 돌아가기"
      >
        &lt;
      </button>
      <h1 class="header-title">아무 말 대잔치</h1>
    </header>
    <div id="global-toast" class="toast hidden"></div>
    <main class="container">
      <section class="auth-box">
        <h2 class="auth-title">회원가입</h2>

        <!-- 프로필 사진 -->
        <section class="profile-section">
          <div class="profile-header">
            <span>프로필 사진</span>
            <p
              id="profile-helper"
              class="helper-text small hidden"
            >
              프로필 사진을 추가해주세요.
            </p>
          </div>

          <div id="profile-placeholder" class="profile-circle">
            <span class="plus-icon">+</span>
            <img
              id="profile-preview"
              class="profile-image hidden"
              alt="프로필 미리보기"
            />
          </div>

          <input
            id="profile-input"
            type="file"
            accept="image/*"
            class="hidden-input"
          />
        </section>

        <!-- 이메일 -->
        <div class="input-group">
          <label for="signup-email">이메일*</label>
          <input
            id="signup-email"
            type="email"
            placeholder="이메일을 입력하세요"
          />
          <p id="signup-email-error" class="helper-text hidden">
            이메일을 입력해주세요.
          </p>
        </div>

        <!-- 비밀번호 -->
        <div class="input-group">
          <label for="signup-password">비밀번호*</label>
          <input
            id="signup-password"
            type="password"
            placeholder="비밀번호를 입력하세요"
          />
          <p id="signup-pw-error" class="helper-text hidden">
            비밀번호는 8자 이상, 20자 이하이며, 대문자, 소문자, 숫자, 특수문자를
            각각 최소 1개 포함해야 합니다.
          </p>
        </div>

        <!-- 비밀번호 확인 -->
        <div class="input-group">
          <label for="signup-password-confirm">비밀번호 확인*</label>
          <input
            id="signup-password-confirm"
            type="password"
            placeholder="비밀번호를 한번 더 입력하세요"
          />
          <p id="signup-pw-confirm-error" class="helper-text hidden">
            비밀번호를 한번 더 입력해주세요.
          </p>
        </div>

        <!-- 닉네임 -->
        <div class="input-group">
          <label for="signup-nickname">닉네임*</label>
          <input
            id="signup-nickname"
            type="text"
            maxlength="20"
            placeholder="닉네임을 입력하세요"
          />
          <p id="signup-nickname-error" class="helper-text hidden">
            닉네임을 입력해주세요.
          </p>
        </div>

        <button
          id="signup-btn"
          class="primary-btn disabled"
          type="button"
          disabled
        >
          회원가입
        </button>

        <button
          id="signup-go-login-btn"
          class="secondary-btn"
          type="button"
        >
          로그인하러 가기
        </button>
      </section>
    </main>

    <script type="module" src="../js/signup.js"></script>
  </body>
</html>
