<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>게시글 목록 | Breathe</title>
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/posts.css" />
  </head>
  <body>
    <header class="global-header">
      <h1 class="global-header-title">Breathe</h1>

      <div class="header-profile-wrapper">
        <button
          id="header-profile-btn"
          class="header-profile-btn"
          type="button"
        >
          <img
            src="../img/dummy.png"
            alt="프로필"
            class="header-profile-img"
          />
        </button>

        <div id="profile-dropdown" class="profile-dropdown hidden">
          <button
            type="button"
            class="dropdown-item"
            data-action="edit-profile"
          >
            회원정보수정
          </button>
          <button
            type="button"
            class="dropdown-item"
            data-action="change-password"
          >
            비밀번호수정
          </button>
          <button type="button" class="dropdown-item" data-action="logout">
            로그아웃
          </button>
        </div>
      </div>
    </header>

    <div id="global-toast" class="toast hidden"></div>

    <main class="post-main">
      <div class="post-content-wrapper">
        <!-- 인사 + 작성 버튼 -->
        <section class="post-intro">
          <div class="intro-text">
            <h2 class="intro-title">오늘 하루는 어떠셨나요?</h2>
            <p class="intro-desc">생각을 잠깐 내려놓고 가볍게 적어보세요.</p>
          </div>

          <button
            id="go-write-btn"
            class="write-btn"
            type="button"
          >
            마음 남기기
          </button>
        </section>

        <!-- 정렬 옵션 -->
        <section class="post-sort-row">
          <button class="sort-btn active" data-sort="latest">최신순</button>
          <button class="sort-btn" data-sort="likes">좋아요순</button>
        </section>

        <!-- 캐러셀 영역 -->
        <section class="post-carousel-section">
          <div class="post-carousel">
            <!-- JS에서 .post-card들을 여기에 채움 -->
            <div id="post-list" class="post-list"></div>
          </div>

          <p id="empty-text" class="empty-text hidden">
            아직 작성된 마음이 없어요.<br />
            가볍게 첫 마음을 남겨보는 건 어떨까요?
          </p>
        </section>
      </div>
    </main>

    <script type="module" src="../js/posts.js"></script>
  </body>
</html>
