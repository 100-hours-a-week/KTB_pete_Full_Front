<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>게시글 수정 | Breathe</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/post-edit.css" />
  </head>
  <body>
    <!-- 공통 헤더 -->
    <header class="global-header">
      <div class="header-back-area">
        <button id="back-btn" class="back-btn" type="button" aria-label="이전 페이지로">
          ←
        </button>
      </div>

      <h1 class="global-header-title">Breathe</h1>

      <div class="header-profile-wrapper">
        <button
          id="header-profile-btn"
          class="header-profile-btn"
          type="button"
        >
          <img
            src="../img/dummy.png"
            alt="프로필"
            class="header-profile-img"
          />
        </button>

        <div id="profile-dropdown" class="profile-dropdown hidden">
          <button
            type="button"
            class="dropdown-item"
            data-action="edit-profile"
          >
            회원정보수정
          </button>
          <button
            type="button"
            class="dropdown-item"
            data-action="change-password"
          >
            비밀번호수정
          </button>
          <button type="button" class="dropdown-item" data-action="logout">
            로그아웃
          </button>
        </div>
      </div>
    </header>

    <div id="global-toast" class="toast hidden"></div>

    <main class="edit-page">
      <!-- 상단 카피 영역 (작성 페이지와 톤 맞추기) -->
      <section class="edit-header">
        <span class="badge-tag">오늘의 고민</span>
        <h2 class="edit-title">이 기록을 조금 다듬어볼까요?</h2>
        <p class="edit-subtitle">
          이미 남겨둔 이야기를 가볍게 고쳐도 괜찮아요. 그때의 나와 지금의 나를 천천히 이어볼게요.
        </p>
      </section>

      <!-- 작성 카드 -->
      <section class="edit-card">
        <form id="post-edit-form" class="edit-form">
          <!-- 제목 -->
          <section class="form-section">
            <label for="title-input" class="form-label">
              제목<span class="required">*</span>
            </label>
            <input
              id="title-input"
              class="text-input"
              type="text"
              placeholder="짧게 한 줄 제목을 남겨주세요. (최대 26자)"
              maxlength="26"
            />
            <div class="helper-row">
              <span id="title-length" class="helper-text">0 / 26</span>
            </div>
          </section>

          <!-- 내용 -->
          <section class="form-section">
            <label for="content-input" class="form-label">
              내용<span class="required">*</span>
            </label>
            <textarea
              id="content-input"
              class="textarea-input"
              rows="10"
              placeholder="그때 남겼던 이야기 중에서, 살리고 싶은 말과 고치고 싶은 말을 적어주세요."
            ></textarea>
          </section>

          <!-- 이미지 업로드 -->
          <section class="form-section">
            <label class="form-label">
              이미지<span class="required">*</span>
            </label>
            <p class="label-description">
              지금 올려둔 이미지를 그대로 둘 수도 있고, 다른 사진으로 바꿀 수도 있어요.
            </p>

            <div class="file-row">
              <label for="image-input" class="file-label">이미지 변경</label>
              <input
                id="image-input"
                class="file-input"
                type="file"
                accept="image/*"
              />
              <span id="file-name" class="file-name">기존 파일 명</span>
            </div>
            <p class="helper-text small">
              이미지는 1개만 업로드 할 수 있습니다.
            </p>
          </section>

          <!-- 버튼 -->
          <section class="form-section button-section">
            <button
              id="submit-edit-btn"
              class="primary-btn disabled"
              type="button"
              disabled
            >
              마음 고치기
            </button>
          </section>
        </form>
      </section>
    </main>

    <script type="module" src="../js/post-edit.js"></script>
  </body>
</html>
