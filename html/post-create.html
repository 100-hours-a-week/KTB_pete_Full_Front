<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>마음 남기기 | Breathe</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/post-create.css" />
  </head>
  <body>
    <header class="global-header">
      <div class="header-back-area">
        <button id="back-btn" class="back-btn" type="button">←</button>
      </div>
      <h1 class="brand-title">Breathe</h1>
      <div class="header-profile-wrapper">
        <button id="header-profile-btn" class="header-profile-btn" type="button">
          <img src="../img/dummy.png" class="header-profile-img" />
        </button>
        <div id="profile-dropdown" class="profile-dropdown hidden">
          <button class="dropdown-item" data-action="edit-profile">회원정보수정</button>
          <button class="dropdown-item" data-action="change-password">비밀번호수정</button>
          <button class="dropdown-item" data-action="logout">로그아웃</button>
        </div>
      </div>
    </header>

    <main class="create-container">
      <!-- 새 안내 제목 -->
      <h2 class="page-title">오늘 어떤 마음이 오셨나요?</h2>
      <p class="page-sub">가볍게 남겨두고 가도 괜찮아요. 당신의 이야기를 들을게요.</p>

      <form id="post-create-form" class="create-form">
        <!-- 제목 -->
        <section class="form-section">
          <label for="title-input" class="form-label">
            제목<span class="required">*</span>
          </label>
          <input
            id="title-input"
            class="text-input"
            type="text"
            placeholder="짧게 한 줄 제목을 남겨주세요. (최대 26자)"
            maxlength="26"
          />
          <div class="helper-row">
            <span id="title-length" class="helper-text">0 / 26</span>
          </div>
        </section>

        <!-- 내용 -->
        <section class="form-section">
          <label for="content-input" class="form-label">
            내용<span class="required">*</span>
          </label>
          <textarea
            id="content-input"
            class="textarea-input"
            rows="10"
            placeholder="지금 마음 상태나 하고 싶은 말을 적어주세요."
          ></textarea>
        </section>

        <!-- 이미지 업로드 -->
        <section class="form-section">
          <label class="form-label">
            이미지<span class="required">*</span>
          </label>
          <div class="file-row">
            <label for="image-input" class="file-label">이미지 선택</label>
            <input
              id="image-input"
              class="file-input"
              type="file"
              accept="image/*"
            />
            <span id="file-name" class="file-name">아직 선택된 파일이 없어요.</span>
          </div>
        </section>

        <!-- 제출 -->
        <section class="form-section button-section">
          <button id="submit-create-btn" class="primary-btn" type="button">
            마음 전하기
          </button>
        </section>
      </form>
    </main>

    <script type="module" src="../js/post-create.js"></script>
  </body>
</html>
