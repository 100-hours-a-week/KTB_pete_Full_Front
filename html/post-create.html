<!-- html/post-create.html -->
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>게시글 작성 | 아무 말 대잔치</title>
    <link rel="stylesheet" href="../css/post-create.css" />
  </head>
  <body>
    <header class="header">
      <button id="back-btn" class="back-btn" type="button">&#60;</button>
      <h1 class="header-title">아무 말 대잔치</h1>
      <div class="header-profile"></div>
    </header>

    <main class="create-container">
      <h2 class="page-title">게시글 작성</h2>

      <form id="post-create-form" class="create-form">
        <!-- 제목 -->
        <section class="form-section">
          <label for="title-input" class="form-label">
            제목<span class="required">*</span>
          </label>
          <input
            id="title-input"
            class="text-input"
            type="text"
            placeholder="제목을 입력해주세요. (최대 26글자)"
            maxlength="26"
          />
          <div class="helper-row">
            <span id="title-length" class="helper-text">0 / 26</span>
          </div>
        </section>

        <!-- 내용 -->
        <section class="form-section">
          <label for="content-input" class="form-label">
            내용<span class="required">*</span>
          </label>
          <textarea
            id="content-input"
            class="textarea-input"
            rows="10"
            placeholder="내용을 입력해주세요."
          ></textarea>
        </section>

        <!-- 이미지 업로드 -->
        <section class="form-section">
          <label class="form-label">
            이미지<span class="required">*</span>
          </label>
          <div class="file-row">
            <label for="image-input" class="file-label">파일 선택</label>
            <input
              id="image-input"
              class="file-input"
              type="file"
              accept="image/*"
            />
            <span id="file-name" class="file-name">파일을 선택해주세요.</span>
          </div>
          <p class="helper-text">
            이미지는 1개만 업로드 할 수 있습니다.
          </p>
        </section>

        <!-- 완료 버튼 -->
        <section class="form-section button-section">
          <button
            id="submit-create-btn"
            class="primary-btn"
            type="button"
          >
            완료
          </button>
        </section>
      </form>
    </main>

    <script type="module" src="../js/post-create.js"></script>
  </body>
</html>
