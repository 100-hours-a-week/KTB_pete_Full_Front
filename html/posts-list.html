<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>전체 게시글 목록 | Breathe</title>
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/posts-list.css" />
  </head>
  <body>
    <header class="global-header">
      <h1 class="global-header-title">Breathe</h1>

      <div class="header-profile-wrapper">
        <button
          id="header-profile-btn"
          class="header-profile-btn"
          type="button"
        >
          <img
            src="../img/dummy.png"
            alt="프로필"
            class="header-profile-img"
          />
        </button>

        <div id="profile-dropdown" class="profile-dropdown hidden">
          <button
            type="button"
            class="dropdown-item"
            data-action="edit-profile"
          >
            회원정보수정
          </button>
          <button
            type="button"
            class="dropdown-item"
            data-action="change-password"
          >
            비밀번호수정
          </button>
          <button type="button" class="dropdown-item" data-action="logout">
            로그아웃
          </button>
        </div>
      </div>
    </header>

    <div id="global-toast" class="toast hidden"></div>

    <main class="post-main">
      <div class="post-content-wrapper">
        <!-- 상단 타이틀 -->
        <section class="post-intro list-intro">
          <div class="intro-text">
            <h2 class="intro-title">게시글 목록</h2>
            <p class="intro-desc">
              전체 게시글을 한 눈에 확인하고, 관심 있는 글을 찾아보세요.
            </p>
          </div>

          <div class="intro-actions">
            <button
              id="go-main-btn"
              class="list-btn"
              type="button"
            >
              메인으로
            </button>

            <button
              id="go-write-btn"
              class="write-btn"
              type="button"
            >
              마음 남기기
            </button>
          </div>
        </section>

        <!-- 정렬 옵션 -->
        <section class="post-sort-row">
          <button
            class="sort-btn active"
            data-sort="latest"
            id="sort-latest-btn"
          >
            최신순
          </button>
          <button
            class="sort-btn"
            data-sort="likes"
            id="sort-likes-btn"
          >
            좋아요순
          </button>
        </section>

        <!-- 전체 목록 -->
        <section class="post-list-section">
          <ul id="post-table" class="post-table">
            <!-- JS에서 li.post-row를 채움 -->
          </ul>

          <p id="list-empty-text" class="empty-text hidden">
            아직 작성된 게시글이 없습니다.
          </p>

          <div class="pagination">
            <button id="prev-page-btn" class="page-btn">이전</button>
            <span id="page-info" class="page-info"></span>
            <button id="next-page-btn" class="page-btn">다음</button>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="../js/posts-list.js"></script>
  </body>
</html>
