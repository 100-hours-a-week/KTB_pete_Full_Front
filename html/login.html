<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>로그인 | Breathe</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="auth-split">
      <!-- 왼쪽: 로그인 영역 -->
      <main class="container auth-left">
        <section class="auth-box">
          <div class="auth-header">
            <p class="auth-badge">MENTAL HEALTH COMMUNITY</p>
            <h2 class="auth-title">로그인</h2>
            <p class="auth-subtitle">
              혼자 끙끙대지 말고, <br /><span class="brand">Breathe</span>에서
              잠깐 마음을 내려놓고 가세요.
            </p>
          </div>

          <div class="input-group">
            <label for="login-email">이메일</label>
            <input
              id="login-email"
              type="email"
              placeholder="이메일을 입력하세요"
            />
            <p id="login-email-error" class="helper-text hidden">
              올바른 이메일 주소 형식을 입력해주세요.
            </p>
          </div>

          <div class="input-group">
            <label for="login-password">비밀번호</label>
            <input
              id="login-password"
              type="password"
              placeholder="비밀번호를 입력하세요"
            />
            <p id="login-pw-error" class="helper-text hidden">
              비밀번호는 8~20자이며 대문자, 소문자, 숫자, 특수문자를 각각 1개
              이상 포함해야 합니다.
            </p>
          </div>

          <button
            id="login-btn"
            class="primary-btn disabled"
            type="button"
            disabled
          >
            숨 고르고 로그인하기
          </button>

          <button
            id="go-signup-btn"
            class="secondary-btn"
            type="button"
          >
            처음 오셨나요? 회원가입 하기
          </button>

          <p class="auth-footer-text">
            Breathe에서는 작성하신 고민과 답변이 <strong>익명</strong>으로만
            표시되며,<br /> 실명과 연락처는 공개되지 않습니다.
          </p>
        </section>
      </main>

      <!-- 오른쪽: 브랜드 & 슬로건 영역 -->
      <section class="auth-right">
        <div class="brand-panel">
          <p class="brand-mark">Breathe</p>
          <h2 class="brand-title">
            혼자 안고 가지 말고,<br />
            여기서 잠깐 쉬어요.
          </h2>
          <p class="brand-tagline">Breathe.</p>
        </div>
      </section>
    </div>

    <div id="global-toast" class="toast hidden"></div>

    <script type="module" src="../js/login.js"></script>
  </body>
</html>
