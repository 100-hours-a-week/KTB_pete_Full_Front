<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>로그인 | 아무 말 대잔치</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="header-title">아무 말 대잔치</h1>
    </header>
    <div id="global-toast" class="toast hidden"></div>
    <main class="container">
      <section class="auth-box">
        <h2 class="auth-title">로그인</h2>

        <div class="input-group">
          <label for="login-email">이메일</label>
          <input
            id="login-email"
            type="email"
            placeholder="이메일을 입력하세요"
          />
          <p id="login-email-error" class="helper-text hidden">
            올바른 이메일 주소 형식을 입력해주세요.
          </p>
        </div>

        <div class="input-group">
          <label for="login-password">비밀번호</label>
          <input
            id="login-password"
            type="password"
            placeholder="비밀번호를 입력하세요"
          />
          <p id="login-pw-error" class="helper-text hidden">
            비밀번호는 8~20자이며 대문자, 소문자, 숫자, 특수문자를 각각 1개
            이상 포함해야 합니다.
          </p>
        </div>

        <button
          id="login-btn"
          class="primary-btn disabled"
          type="button"
          disabled
        >
          로그인
        </button>

        <button
          id="go-signup-btn"
          class="secondary-btn"
          type="button"
        >
          회원가입 하러가기
        </button>
      </section>
    </main>

    <script type="module" src="../js/login.js"></script>
  </body>
</html>
