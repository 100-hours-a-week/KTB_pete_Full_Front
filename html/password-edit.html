<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>비밀번호 수정 | Breathe</title>
    <!-- 비밀번호 수정 전용 스타일 -->
     <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/password-edit.css" />
    <link rel="stylesheet" href="../css/header.css" />
  </head>
  <body>
    <!-- 공통 헤더 -->
    <header class="global-header">
      <h1 class="global-header-title">Breathe</h1>
      <div class="header-profile-wrapper">
        <button
          id="header-profile-btn"
          class="header-profile-btn"
          type="button"
        >
          <img
            src="../img/dummy.png"
            alt="프로필"
            class="header-profile-img"
          />
        </button>

        <div id="profile-dropdown" class="profile-dropdown hidden">
          <button
            type="button"
            class="dropdown-item"
            data-action="edit-profile"
          >
            회원정보수정
          </button>
          <button
            type="button"
            class="dropdown-item"
            data-action="change-password"
          >
            비밀번호수정
          </button>
          <button type="button" class="dropdown-item" data-action="logout">
            로그아웃
          </button>
        </div>
      </div>
    </header>
    
    <main class="profile-edit-page password-edit-page">
  <section class="profile-card">
    <p class="page-badge">계정 보안</p>
    <h2 class="page-title">비밀번호를 새로 정해볼까요?</h2>
    <p class="page-subtitle">
      예전의 비밀번호를 가볍게 보내주고, 지금의 나에게 맞는 비밀번호로 천천히 바꿔볼게요.
    </p>

    <form id="password-edit-form" novalidate>
      <!-- 비밀번호 -->
      <div class="form-group">
        <label for="password" class="input-label">새 비밀번호*</label>
        <input
          id="password"
          name="password"
          type="password"
          class="input-field"
          placeholder="비밀번호를 입력하세요"
          autocomplete="new-password"
        />
        <p id="password-helper" class="input-helper"></p>
      </div>

      <!-- 비밀번호 확인 -->
      <div class="form-group">
        <label for="passwordConfirm" class="input-label">새 비밀번호 확인*</label>
        <input
          id="passwordConfirm"
          name="passwordConfirm"
          type="password"
          class="input-field"
          placeholder="비밀번호를 한번 더 입력하세요"
          autocomplete="new-password"
        />
        <p id="password-confirm-helper" class="input-helper"></p>
      </div>

      <!-- 수정 버튼 -->
      <button
        id="password-submit-btn"
        type="submit"
        class="primary-btn full-width"
        disabled
      >
        비밀번호 바꾸기
      </button>
    </form>
  </section>
</main>


    <!--  여기 토스트 추가됨 -->
    <div id="toast" class="toast hidden"></div>

    <!-- 이 페이지 전용 스크립트 -->
    <script type="module" src="../js/password-edit.js"></script>
  </body>
</html>
